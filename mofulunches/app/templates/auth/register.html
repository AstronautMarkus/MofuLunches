{% extends 'base/base.html' %}

{% block title %}Registrarse - MofuLunches{% endblock %}

{% block content %}
<div class="flex items-center justify-center">
  <div class="w-full max-w-md p-8 space-y-6 bg-white rounded shadow">
    <h2 class="text-2xl font-bold text-center">Registrarse</h2>
    <form method="POST" class="space-y-4">
      <div>
        <label for="first_name" class="block mb-2 text-sm font-medium text-gray-700">Nombre</label>
        <input type="text" name="first_name" id="first_name" required class="block w-full px-4 py-2 border rounded focus:ring focus:ring-blue-200" />
      </div>
      <div>
        <label for="last_name" class="block mb-2 text-sm font-medium text-gray-700">Apellido</label>
        <input type="text" name="last_name" id="last_name" required class="block w-full px-4 py-2 border rounded focus:ring focus:ring-blue-200" />
      </div>
      <div>
        <label for="email" class="block mb-2 text-sm font-medium text-gray-700">Email</label>
        <input type="email" name="email" id="email" required class="block w-full px-4 py-2 border rounded focus:ring focus:ring-blue-200" />
      </div>
      <div>
        <label for="password" class="block mb-2 text-sm font-medium text-gray-700">Contraseña</label>
        <input type="password" name="password" id="password" required class="block w-full px-4 py-2 border rounded focus:ring focus:ring-blue-200" />
      </div>
      <button type="submit" class="w-full px-4 py-2 font-semibold text-white bg-blue-600 rounded hover:bg-blue-700">Registrarse</button>
    </form>
    <p class="text-sm text-center text-gray-600">
      ¿Ya tienes cuenta?
      <a href="" class="text-blue-600 hover:underline">Inicia sesión</a>
    </p>
  </div>
</div>
{% endblock %}
