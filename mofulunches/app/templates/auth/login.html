{% extends 'base/base.html' %}

{% block title %}Iniciar sesión - MofuLunches{% endblock %}

{% block content %}
<div class="flex items-center justify-center mt-12">
  <div class="w-full max-w-md p-8 space-y-6 rounded shadow">
    <h2 class="text-2xl font-bold text-center">Iniciar sesión</h2>
    <form method="POST" class="max-w-sm mx-auto">
      <div class="mb-5">
        <label for="email" class="block mb-2.5 text-sm font-medium text-heading">Correo electrónico</label>
        <input type="email" name="email" id="email" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="Ingrese su correo electrónico" required />
      </div>
      <div class="mb-5">
        <label for="password" class="block mb-2.5 text-sm font-medium text-heading">Contraseña</label>
        <div class="relative">
          <input type="password" name="password" id="password" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body pr-10" placeholder="Ingrese su contraseña" required />
          <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 flex items-center px-3 text-sm text-gray-600 focus:outline-none" tabindex="-1">
            Mostrar
          </button>
        </div>
      </div>
      <button type="submit" class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none cursor-pointer">Iniciar sesión</button>
    </form>
    <p class="text-sm text-center text-gray-600">
      ¿No tienes una cuenta?
      <a href="{{ url_for('auth.register') }}" class="text-blue-600 hover:underline">Regístrate</a>
    </p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const passwordInput = document.getElementById('password');
  const togglePassword = document.getElementById('togglePassword');
  togglePassword.addEventListener('click', function () {
    const type = passwordInput.type === 'password' ? 'text' : 'password';
    passwordInput.type = type;
    this.textContent = type === 'password' ? 'Mostrar' : 'Ocultar';
  });
</script>
{% endblock %}
