<header class="bg-blue-900 shadow-md px-6 py-4 flex items-center justify-between">
    <a href="{{ url_for('main.home') }}" class="flex items-center gap-3">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo de MofuLunches" class="h-12 w-12 pointer-events-none">
        <span class="text-2xl font-extrabold text-white tracking-tight hover:text-yellow-300 hover:underline transition-all">MofuLunches</span>
    </a>
    <button id="hamburger-btn" class="md:hidden flex flex-col justify-center items-center w-10 h-10 rounded focus:outline-none bg-blue-800" aria-label="Abrir menú">
        <span class="block w-6 h-0.5 bg-white mb-1"></span>
        <span class="block w-6 h-0.5 bg-white mb-1"></span>
        <span class="block w-6 h-0.5 bg-white"></span>
    </button>
    <nav id="main-nav" class="flex flex-col items-start gap-2 md:flex-row md:items-center md:gap-6 md:static md:bg-transparent absolute top-16 left-0 w-full bg-blue-900 md:w-auto md:top-auto md:left-auto transition-all duration-300 z-50 hidden md:block pb-6 md:pb-0">
        <a href="" class="px-4 py-2 rounded-lg text-white font-medium hover:text-yellow-300 hover:underline transition-all w-[95%] max-w-[95%] mx-auto md:w-auto text-left md:text-center">Inicio</a>
        <a href="" class="px-4 py-2 rounded-lg text-white font-medium hover:text-yellow-300 hover:underline transition-all w-[95%] max-w-[95%] mx-auto md:w-auto text-left md:text-center">Menú</a>
        <a href="" class="px-4 py-2 rounded-lg text-white font-medium hover:text-yellow-300 hover:underline transition-all w-[95%] max-w-[95%] mx-auto md:w-auto text-left md:text-center">Contacto</a>
        {% if current_user.is_authenticated %}
            <a href="" class="px-4 py-2 rounded-lg bg-white text-blue-900 font-semibold hover:bg-blue-100 transition w-[95%] max-w-[95%] mx-auto md:w-auto text-left md:text-center">Mi Perfil</a>
            <form action="" method="post" class="inline w-[95%] max-w-[95%] mx-auto md:w-auto">
                <button type="submit" class="px-4 py-2 rounded-lg bg-red-500 text-white font-semibold hover:bg-red-700 transition w-full md:w-auto text-left md:text-center">Cerrar sesión</button>
            </form>
        {% else %}
            <a href="" class="px-4 py-2 rounded-lg bg-white text-blue-900 font-semibold hover:bg-blue-100 transition w-[95%] max-w-[95%] mx-auto md:w-auto text-left md:text-center">Iniciar sesión</a>
            <a href="" class="px-4 py-2 rounded-lg border border-white text-white font-semibold hover:bg-blue-800 transition w-[95%] max-w-[95%] mx-auto md:w-auto text-left md:text-center">Registrarse</a>
        {% endif %}
    </nav>
    <script>
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const mainNav = document.getElementById('main-nav');
        hamburgerBtn.addEventListener('click', function() {
            mainNav.classList.toggle('hidden');
        });
        document.addEventListener('click', function(e) {
            if (!hamburgerBtn.contains(e.target) && !mainNav.contains(e.target) && window.innerWidth < 768) {
                mainNav.classList.add('hidden');
            }
        });
        window.addEventListener('resize', function() {
            if (window.innerWidth >= 768) {
                mainNav.classList.remove('hidden');
            } else {
                mainNav.classList.add('hidden');
            }
        });
    </script>
</header>
